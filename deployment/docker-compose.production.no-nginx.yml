services:
  db:
    image: postgres:15
    container_name: oktools_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oktools_redis
    restart: unless-stopped
    volumes:
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_web
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Additional mounts (NAS, custom volumes) can be added via docker-compose.override.yml
      # Run: ./deployment/scripts/generate-override.sh to generate override file from .env
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_worker:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_celery_worker
    user: app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Additional mounts (NAS, custom volumes) can be added via docker-compose.override.yml
      # Run: ./deployment/scripts/generate-override.sh to generate override file from .env
    entrypoint: ["/app/deployment/entrypoint.celery.sh"]
    command: celery -A ok_tools worker --loglevel=info --queues=celery
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '[c]elery.*worker' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_download_worker:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_celery_download_worker
    user: app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Additional mounts (NAS, custom volumes) can be added via docker-compose.override.yml
      # Run: ./deployment/scripts/generate-override.sh to generate override file from .env
    entrypoint: ["/app/deployment/entrypoint.celery.sh"]
    command: celery -A ok_tools worker --loglevel=info --queues=download --concurrency=${CELERY_DOWNLOAD_WORKER_CONCURRENCY:-1}
    # SIGTERM triggers a Celery warm shutdown: the running transfer is allowed
    # to finish before the container stops. Without this Docker kills the
    # worker after 10s and aborts a multi-GB copy halfway (update.sh also
    # waits for idle workers first; this is the safety net).
    stop_grace_period: 30m
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '[c]elery.*worker.*download' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_render_worker:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_celery_render_worker
    user: app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Additional mounts (NAS, custom volumes) can be added via docker-compose.override.yml
      # Run: ./deployment/scripts/generate-override.sh to generate override file from .env
    entrypoint: ["/app/deployment/entrypoint.celery.sh"]
    command: celery -A ok_tools worker --loglevel=info --queues=render --concurrency=2
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '[c]elery.*worker.*render' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_copy_worker:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_celery_copy_worker
    user: app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Additional mounts (NAS, custom volumes) can be added via docker-compose.override.yml
      # Run: ./deployment/scripts/generate-override.sh to generate override file from .env
    entrypoint: ["/app/deployment/entrypoint.celery.sh"]
    command: celery -A ok_tools worker --loglevel=info --queues=copy --concurrency=${CELERY_COPY_WORKER_CONCURRENCY:-1}
    # SIGTERM triggers a Celery warm shutdown: the running transfer is allowed
    # to finish before the container stops. Without this Docker kills the
    # worker after 10s and aborts a multi-GB copy halfway (update.sh also
    # waits for idle workers first; this is the safety net).
    stop_grace_period: 30m
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '[c]elery.*worker.*copy' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_anchor_render_worker:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_celery_anchor_render_worker
    user: app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Additional mounts (NAS, custom volumes) can be added via docker-compose.override.yml
      # Run: ./deployment/scripts/generate-override.sh to generate override file from .env
    entrypoint: ["/app/deployment/entrypoint.celery.sh"]
    command: celery -A ok_tools worker --loglevel=info --queues=anchor_render --concurrency=${CELERY_ANCHOR_RENDER_WORKER_CONCURRENCY:-1}
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '[c]elery.*worker.*anchor_render' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_beat:
    build:
      context: ../ok_tools
      dockerfile: deployment/production.Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: oktools_celery_beat
    user: app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: celery -A ok_tools beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E '[c]elery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:


networks:
  oktools-network:
    driver: bridge
